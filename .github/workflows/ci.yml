name: ci

# Every pull request and every push to main. No path filters and no matrix: the
# ruleset "require ci-required on main" waits for a check named exactly `ci-required`,
# and a workflow that does not run leaves that check missing and the merge blocked.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # R-023: the site loads nothing from another origin.
      - run: sh checks/no-third-party.sh
      # R-021: the landing page says what Linkling is.
      - run: sh checks/landing.sh
      # The two checks above, tried on fixtures that must pass, fail and go blind.
      - run: node checks/selftest.mjs
